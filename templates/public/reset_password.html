<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Password</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>

<body class="auth-layout">

  <aside class="auth-aside">
    <span class="tagline">Moita's<br>Server</span>
    <p>"The only way to do great work is to love what you do."<br> - Steve Jobs</p>
  </aside>

  <main class="auth-main">
    <div class="form-container">
      <h2>Nova password</h2>

      <input type="password" id="password"         placeholder="Nova password"     onkeydown="if(event.key==='Enter')submeter()">
      <input type="password" id="confirm_password" placeholder="Confirmar password" onkeydown="if(event.key==='Enter')submeter()">

      <p id="erro"></p>

      <button onclick="submeter()">Guardar</button>
      <p><a href="/login">Voltar ao login</a></p>
    </div>
  </main>

  <script src="/static/js/reset_password.js"></script>

</body>
